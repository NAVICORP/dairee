<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dairee: the milk round, customers, bills and the herd.">
  <meta name="theme-color" content="#F7F9FC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dairee">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Dairee</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F7F9FC; }
    /* The first paint: the icon, while the app loads. Nothing from another
       site sits in the way: fonts and the engine are served from here. */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #5A6782; transition: opacity .3s; }
    #boot img { width: 72px; height: 72px; border-radius: 18px; }
    #boot .bar { width: 120px; height: 4px; border-radius: 4px; background: #E3EEFF; overflow: hidden; }
    #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #1F5FD6; animation: run 1.1s ease-in-out infinite; }
    #boot.offline .bar { display: none; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt=""><div class="bar"><i></i></div><span id="boot-note"></span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

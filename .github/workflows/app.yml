# The Dairee app (Android, iPhone and the web): checks and builds on every push.
#
# 1. check: flutter analyze and the tests.
# 2. screens: a picture of every main screen, pushed to the `screens` branch,
#    so the design can be checked without a phone.
# 3. web: the web app, as served at dairee.skifi.co/app (Actions > the run >
#    Artifacts). The server image is built by server.yml.
# 4. android: a release APK to install on a phone. With the signing secrets
#    set, also the Play Store bundle.
# 5. ios: a full iOS build, on request only (Run workflow, or "[ios]" in the
#    commit message), because Mac minutes cost more. Unsigned by default, as a
#    check. With "testflight" ticked it signs the app with the App Store
#    Connect API key and uploads it to TestFlight. That needs the app made in
#    App Store Connect and four secrets: APPLE_TEAM_ID,
#    APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and
#    APP_STORE_CONNECT_KEY_P8. Each run makes its own certificate and profile
#    and revokes them at the end (.github/scripts/asc_signing.py).

name: App

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "tools/**"
      - "supabase/**"
      - ".github/workflows/app.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build iOS"
        type: boolean
        default: true
      testflight:
        description: "Sign the iOS build and upload it to TestFlight"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: set -o pipefail; flutter analyze --no-fatal-infos 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - working-directory: app
        run: set -o pipefail; flutter test 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - if: failure()
        run: python3 .github/scripts/annotate.py "$RUNNER_TEMP/out.log" "Check"

  # Pictures of every main screen, pushed to the `screens` branch, so the
  # design can be checked without a phone. The screens show the demo farm
  # (tools/demo.sql) as the real database rules answer for it: it is loaded
  # into Postgres here and recorded (tools/record_screens.py) for the tests.
  screens:
    needs: check
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: demo
      # The demo farm is in India: the pictures' "today" is the farm's today.
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v5
      - name: The demo farm
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/platform.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -1 -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f tools/demo.sql > /dev/null
          pip install -q "psycopg[binary]"
          python3 tools/record_screens.py app/test_screens/fixtures.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: set -o pipefail; flutter test test_screens --update-goldens 2>&1 | tee -a "$RUNNER_TEMP/out.log"
        continue-on-error: true
      - run: python3 .github/scripts/annotate.py "$RUNNER_TEMP/out.log" "Screens"
        if: always()
      - name: Push the pictures to the screens branch
        run: |
          set -e
          ls app/test_screens/shots/*.png > /dev/null 2>&1 || { echo "no pictures"; exit 0; }
          mkdir -p /tmp/shots && cp app/test_screens/shots/*.png /tmp/shots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screens-tmp
          git rm -rf --quiet .
          git clean -fdq
          cp /tmp/shots/*.png .
          echo "${{ github.sha }}" > SOURCE
          git add -A
          git commit -qm "Screens for ${{ github.sha }}"
          git push -f origin HEAD:screens

  # The web app as served at dairee.skifi.co/app, opened in a real browser
  # (.github/scripts/web_check.mjs): it must draw, follow a customer link, and
  # open again with no network. Its pictures join the `screens` branch.
  web:
    needs: [check, screens]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      # The engine and fonts come from dairee.skifi.co itself, not a CDN:
      # nothing from another site sits in the way of opening the app.
      - working-directory: app
        run: set -o pipefail; flutter build web --release --no-web-resources-cdn --base-href /app/ 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - if: failure()
        run: python3 .github/scripts/annotate.py "$RUNNER_TEMP/out.log" "Web"
      - run: rm -f app/build/web/flutter_service_worker.js && du -sh app/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: dairee-web
          path: app/build/web
          retention-days: 14
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Open it in a browser
        run: |
          npm i --no-save --silent playwright@1
          npx playwright install --with-deps chromium > /dev/null
          PORT=8000 node server/site.mjs > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          node .github/scripts/web_check.mjs http://127.0.0.1:8000
      - name: Add the pictures to the screens branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls web-shots/*.png > /dev/null 2>&1 || exit 0
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          if ! git clone -q --depth 1 -b screens "$remote" /tmp/screens; then
            mkdir -p /tmp/screens && git -C /tmp/screens init -q -b screens
          fi
          cp web-shots/*.png /tmp/screens/
          cd /tmp/screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web app pictures for ${{ github.sha }}" || exit 0
          git push -q "$remote" HEAD:screens

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - name: Signing key (when the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets: the APK is signed with the debug key, fine for testing."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/android/key.properties
      - working-directory: app
        run: set -o pipefail; flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee -a "$RUNNER_TEMP/out.log"
      - if: failure()
        run: python3 .github/scripts/annotate.py "$RUNNER_TEMP/out.log" "Android"
      - uses: actions/upload-artifact@v4
        with:
          name: dairee-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Play Store bundle
        if: ${{ hashFiles('app/android/key.properties') != '' }}
        working-directory: app
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/android/key.properties') != '' }}
        with:
          name: dairee-android-bundle
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    needs: check
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.ios || inputs.testflight)) || contains(github.event.head_commit.message, '[ios]') }}
    runs-on: macos-latest
    env:
      TESTFLIGHT: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
      SIGNING_DIR: ${{ github.workspace }}/../signing
    steps:
      - uses: actions/checkout@v5
      - name: Newest Xcode on the runner
        run: |
          x=$(ls -d /Applications/Xcode_*.app 2>/dev/null | python3 -c "import re,sys; v=[l.strip() for l in sys.stdin if re.search(r'Xcode_[0-9.]+\.app$', l.strip())]; v.sort(key=lambda p: [int(n) for n in re.findall(r'[0-9]+', p.split('Xcode_')[1])]); print(v[-1] if v else '')")
          if [ -n "$x" ]; then sudo xcode-select -s "$x/Contents/Developer"; fi
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1{split($2,a,"."); print a[1]}')
          if [ "$major" -lt 26 ]; then
            if [ "$TESTFLIGHT" = "true" ]; then echo "::error::App Store Connect needs apps built with Xcode 26 or later; this runner has Xcode $major."; exit 1; fi
            echo "::warning::Xcode $major is older than the App Store minimum (Xcode 26)."
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get

      - name: Unsigned build (a check)
        if: env.TESTFLIGHT != 'true'
        working-directory: app
        run: set -o pipefail; flutter build ios --release --no-codesign --build-number=${{ github.run_number }} 2>&1 | tee -a "$RUNNER_TEMP/out.log"

      - name: TestFlight secrets
        if: env.TESTFLIGHT == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '45M72FMM6U' }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'J72XQ7U8QY' }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'f3d54e68-e67b-4c6e-bb31-37f4fe57d6fc' }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          missing=""
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APP_STORE_CONNECT_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          python3 .github/scripts/p8.py > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "P12_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Certificate and profile from App Store Connect
        if: env.TESTFLIGHT == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '45M72FMM6U' }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'J72XQ7U8QY' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'f3d54e68-e67b-4c6e-bb31-37f4fe57d6fc' }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/asc_signing.py setup "$SIGNING_DIR"
          kc="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$P12_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$P12_PASSWORD" "$kc"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$kc" -T /usr/bin/codesign || true
          security import "$SIGNING_DIR/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          uuid=$(python3 -c "import json; print(json.load(open('$SIGNING_DIR/state.json'))['profile_uuid'])")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$SIGNING_DIR/profile.mobileprovision" "$d/$uuid.mobileprovision"
          done

      - name: Signed build
        if: env.TESTFLIGHT == 'true'
        working-directory: app
        run: set -o pipefail; flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist="$SIGNING_DIR/ExportOptions.plist" 2>&1 | tee -a "$RUNNER_TEMP/out.log"

      - name: Upload to TestFlight
        if: env.TESTFLIGHT == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'J72XQ7U8QY' }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'f3d54e68-e67b-4c6e-bb31-37f4fe57d6fc' }}
        run: |
          set -e
          ipa=$(ls app/build/ios/ipa/*.ipa | head -1)
          app_id=$(python3 -c "import json; print(json.load(open('$SIGNING_DIR/state.json'))['app_id'])")
          version=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys" xcrun altool --upload-package "$ipa" -t ios \
            --apple-id "$app_id" --bundle-id co.skifi.dairee \
            --bundle-short-version-string "$version" --bundle-version "${{ github.run_number }}" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format normal
          echo "Uploaded Dairee $version (${{ github.run_number }}). It shows in App Store Connect > TestFlight once Apple has processed it, usually 10 to 30 minutes." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.TESTFLIGHT == 'true' && success()
        with:
          name: dairee-ios-ipa
          path: app/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Revoke the run's certificate and profile
        if: always() && env.TESTFLIGHT == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '45M72FMM6U' }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'J72XQ7U8QY' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'f3d54e68-e67b-4c6e-bb31-37f4fe57d6fc' }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          [ -x "$RUNNER_TEMP/venv/bin/python" ] || exit 0
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/asc_signing.py cleanup "$SIGNING_DIR"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$SIGNING_DIR" "$RUNNER_TEMP/keys"

      - if: failure()
        run: python3 .github/scripts/annotate.py "$RUNNER_TEMP/out.log" "iOS"

# The Dairee server: the database rules (with their tests) and the site,
# checked on every push that touches them. On main, the server image is built
# (with the web app inside) and pushed to ghcr.io/navicorp/dairee, and
# Dokploy is asked to redeploy.
name: Server

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/**"
      - "tools/**"
      - "server/**"
      - "web/**"
      - "app/**"
      - "Dockerfile"
      - "deploy/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dairee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: dairee
    steps:
      - uses: actions/checkout@v5
      - name: The shared platform pieces (auth schema and roles, a copy from the app base)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/platform.sql
      - name: Migrations
        run: for f in supabase/migrations/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -1 -f "$f"; done
      - name: Database tests
        run: |
          set -o pipefail
          for t in supabase/tests/*_test.sql; do echo "== $t"; psql -v ON_ERROR_STOP=1 -q -f "$t" 2>&1 | grep -E "NOTICE|ERROR"; done
      - name: The demo farm loads, and its money adds up
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tools/demo.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -At -c "select public.money_invariant_for(id) from public.farms" | tee /dev/stderr | grep -q '"ok": true'
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check server/site.mjs

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: The web app
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href /app/
          rm -f build/web/flutter_service_worker.js
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/navicorp/dairee:latest
            ghcr.io/navicorp/dairee:${{ github.sha }}
          cache-from: type=gha,scope=dairee
          cache-to: type=gha,mode=max,scope=dairee
      # Asks Dokploy to redeploy once the new image is up. Set up in the repo
      # settings: variables DOKPLOY_URL and DOKPLOY_COMPOSE_IDS (space
      # separated), secret DOKPLOY_TOKEN. Skipped until they exist.
      - name: Redeploy on the server
        if: ${{ vars.DOKPLOY_URL != '' }}
        env:
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          for id in ${{ vars.DOKPLOY_COMPOSE_IDS }}; do
            curl -fsS -X POST "${{ vars.DOKPLOY_URL }}/api/compose.deploy" \
              -H "x-api-key: $DOKPLOY_TOKEN" -H "Content-Type: application/json" \
              -d "{\"composeId\":\"$id\"}"
            echo " redeploy asked for $id"
          done
